[package]
name = "wut"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
description = "A tiny, read-only coding agent backed by Cerebras"
license = "MIT"
repository = "https://github.com/ethanolivertroy/wut"
readme = "README.md"
keywords = ["ai", "cli", "coding-agent", "cerebras"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[[bin]]
name = "wut"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "events"] }
serde_json = "1"
unicode-width = { version = "0.2", default-features = false }
ureq = { version = "2", default-features = false, features = ["tls"] }
regex = { version = "1", default-features = false, features = ["std", "perf"] }
walkdir = "2"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = true
