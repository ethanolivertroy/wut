[package]
name = "wut"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A fast, read-only multiplexer for coding-agent CLIs"
license = "MIT"
repository = "https://github.com/ethanolivertroy/wut"
readme = "README.md"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "wut"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
