[package]
name = "wut"
version = "0.0.5"
edition = "2024"
rust-version = "1.88"
description = "A tiny, fast terminal assistant powered by Cerebras or Groq"
license = "MIT"
repository = "https://github.com/ethanolivertroy/wut"
readme = "README.md"
exclude = [".agents/", "evals/", "Formula/", "npm/", "scripts/", "skills-lock.json"]
keywords = ["ai", "cli", "terminal", "assistant", "cerebras"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "wut"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "events"] }
serde_json = { version = "1", features = ["raw_value"] }
unicode-width = { version = "0.2", default-features = false }
ureq = { version = "2", default-features = false, features = ["tls"] }
regex = { version = "1", default-features = false, features = ["std", "perf"] }
walkdir = "2"
ctrlc = { version = "3", default-features = false }
libc = "0.2"
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
rquickjs = { version = "0.14", default-features = false, features = ["std"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = true
